<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tokenobral</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #ffffff; color: #111; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .logo { font-size: 24px; font-weight: 800; margin-bottom: 20px; }
        .logo span { color: #22c55e; }
        .box { width: 100%; max-width: 400px; background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 20px; box-sizing: border-box; }
        input { width: 100%; padding: 12px; margin: 8px 0 16px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; background: #22c55e; color: #000; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #16a34a; }
        .hidden { display: none !important; }
        .err { color: red; font-size: 14px; text-align: center; margin-top: 10px; }
        .api { font-family: monospace; font-weight: bold; color: #16a34a; word-break: break-all; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="logo">TOKEN<span>OBRAL</span></div>

    <!-- Form Login Langsung Muncul -->
    <div id="login-box" class="box">
        <h3 style="margin-top:0; text-align:center;">Masuk Akun</h3>
        <label>Email</label>
        <input type="email" id="email" placeholder="email@anda.com">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••">
        <button onclick="doLogin()" id="btn">Masuk</button>
        <div id="msg" class="err"></div>
    </div>

    <!-- Dashboard (Awalnya Sembunyi) -->
    <div id="dash-box" class="box hidden">
        <div style="text-align:center;">
            <p style="color:#666; font-size:12px; margin:0;">API KEY KAMU</p>
            <div id="api-key" class="api">Memuat...</div>
            <button onclick="copyKey()">Copy API Key</button>
        </div>
        <div style="text-align:center; margin-top:20px;">
            <p style="color:#666; font-size:12px; margin:0;">SISA KUOTA</p>
            <div id="quota" style="font-size:24px; font-weight:bold; margin:10px 0;">0 Token</div>
            <button style="background:#fff; border:2px solid #22c55e;">Top-up</button>
        </div>
        <button onclick="doLogout()" style="background:#ef4444; color:#fff; margin-top:20px;">Logout</button>
    </div>

    <script>
        const SUPA_URL = 'https://ebzycnqfbrsbqhmthmux.supabase.co';
        const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVienljbnFmYnJzYnFobXRobXV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMzI3MjcsImV4cCI6MjEwMTYwODcyN30.HfB6CSHtY_jM-1YKS0-2IlU2MtsOgWSNkOaguMQ4Pt0';
        const WORKER = 'https://tokenobral-api.cakagus.workers.dev';
        let token = '';

        async function doLogin() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('btn');
            const msg = document.getElementById('msg');

            if(!email || !pass) { msg.innerText = "Isi email & password!"; return; }
            btn.innerText = "Loading..."; btn.disabled = true; msg.innerText = "";

            try {
                const res = await fetch(SUPA_URL + '/auth/v1/token?grant_type=password', {
                    method: 'POST',
                    headers: { 'apikey': SUPA_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: pass })
                });
                const data = await res.json();
                
                if (!res.ok) throw new Error(data.error_description || "Login Gagal");

                token = data.access_token;
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('dash-box').classList.remove('hidden');
                fetchStats();
            } catch (e) {
                msg.innerText = e.message;
                btn.innerText = "Masuk"; btn.disabled = false;
            }
        }

        async function fetchStats() {
            try {
                const res = await fetch(WORKER + '/api/user-stats', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                document.getElementById('api-key').innerText = data.api_key || "Belum ada";
                document.getElementById('quota').innerText = new Intl.NumberFormat('id-ID').format(data.token_quota || 0) + " Token";
            } catch (e) {
                document.getElementById('api-key').innerText = "Error load";
            }
        }

        function copyKey() {
            const k = document.getElementById('api-key').innerText;
            if(k === 'Memuat...' || k === 'Error load') return;
            navigator.clipboard.writeText(k);
            alert("Key dicopy!");
        }

        function doLogout() {
            token = '';
            document.getElementById('login-box').classList.remove('hidden');
            document.getElementById('dash-box').classList.add('hidden');
            document.getElementById('btn').innerText = "Masuk"; document.getElementById('btn').disabled = false;
        }
    </script>
</body>
</html>
