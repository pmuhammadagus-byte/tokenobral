<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tokenobral Dashboard</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #ffffff; color: #111; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .logo { font-size: 24px; font-weight: 800; margin-bottom: 20px; text-align: center; }
        .logo span { color: #22c55e; }
        .box { width: 100%; max-width: 400px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px; box-sizing: border-box; margin-bottom: 15px; }
        .box-white { background: #fff; }
        input { width: 100%; padding: 12px; margin: 8px 0 16px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; background: #22c55e; color: #000; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #16a34a; }
        .btn-outline { background: #fff; border: 2px solid #22c55e; }
        .hidden { display: none !important; }
        .err { color: red; font-size: 14px; text-align: center; margin-top: 10px; }
        .api { font-family: monospace; font-weight: bold; color: #16a34a; word-break: break-all; margin: 10px 0; text-align: center; }
        .url-box { background: #fff; border: 1px solid #e5e7eb; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
        .url-box code { font-size: 12px; color: #16a34a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .url-box button { width: auto; padding: 6px 12px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="logo">TOKEN<span>OBRAL</span></div>

    <!-- FORM LOGIN -->
    <div id="login-box" class="box box-white">
        <h3 style="margin-top:0; text-align:center;">Masuk Akun</h3>
        <label>Email</label>
        <input type="email" id="email" placeholder="email@anda.com">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••">
        <button onclick="doLogin()" id="btn-login">Masuk</button>
        <div id="msg" class="err"></div>
    </div>

    <!-- DASHBOARD -->
    <div id="dash-box" class="hidden" style="width:100%; max-width:400px;">
        
        <!-- ENDPOINT URL -->
        <div class="box box-white">
            <p style="font-size:12px; font-weight:bold; color:#6b7280; margin:0 0 5px 0;">ENDPOINT URL</p>
            <div class="url-box">
                <code>https://tokenobral-api.cakagus.workers.dev/v1</code>
                <button onclick="copyText('https://tokenobral-api.cakagus.workers.dev/v1')">Copy</button>
            </div>
        </div>

        <!-- API KEY -->
        <div class="box box-white" style="text-align:center;">
            <p style="color:#6b7280; font-size:12px; margin:0;">API KEY KAMU</p>
            <div id="api-key" class="api">Memuat...</div>
            <button onclick="copyKey()">Copy API Key</button>
        </div>

        <!-- KUOTA -->
        <div class="box" style="text-align:center;">
            <p style="color:#6b7280; font-size:12px; margin:0;">SISA KUOTA</p>
            <div id="quota" style="font-size:24px; font-weight:bold; margin:10px 0; color:#000;">0 Token</div>
            <button class="btn-outline" onclick="topUp()">Beli / Top-up Paket</button>
        </div>

        <!-- MODEL AI (Tampilan Statis seperti desain awal) -->
        <div class="box box-white">
            <p style="font-size:12px; font-weight:bold; color:#6b7280; margin:0 0 10px 0; text-align:center;">MODEL AI TERSEDIA</p>
            <div style="background:#000; color:#fff; border-radius:8px; padding:15px; text-align:center;">
                <h4 style="color:#22c55e; margin:0 0 10px 0; font-size: 18px;">auto-router</h4>
                <p style="font-size:12px; color:#ccc; margin:0 0 15px 0; line-height:1.4;">Satu endpoint, auto-route ke model terbaik: GPT-4o, Claude, Gemini, DeepSeek, dll.</p>
                <button style="background:#fff; color:#000; padding:10px; font-size:14px;" onclick="copyText('auto-router')">Copy Model ID</button>
            </div>
        </div>

        <button onclick="doLogout()" style="background:#ef4444; color:#fff; margin-bottom: 20px;">Logout</button>
    </div>

    <script>
        const SUPA_URL = 'https://ebzycnqfbrsbqhmthmux.supabase.co';
        const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVienljbnFmYnJzYnFobXRobXV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMzI3MjcsImV4cCI6MjEwMTYwODcyN30.HfB6CSHtY_jM-1YKS0-2IlU2MtsOgWSNkOaguMQ4Pt0';
        const WORKER = 'https://tokenobral-api.cakagus.workers.dev';
        let token = '';

        async function doLogin() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('btn-login');
            const msg = document.getElementById('msg');

            if(!email || !pass) { msg.innerText = "Isi email & password!"; return; }
            btn.innerText = "Loading..."; btn.disabled = true; msg.innerText = "";

            try {
                const res = await fetch(SUPA_URL + '/auth/v1/token?grant_type=password', {
                    method: 'POST',
                    headers: { 'apikey': SUPA_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: pass })
                });
                const data = await res.json();
                
                if (!res.ok) throw new Error(data.error_description || "Login Gagal");

                token = data.access_token;
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('dash-box').classList.remove('hidden');
                fetchStats();
            } catch (e) {
                msg.innerText = e.message;
                btn.innerText = "Masuk"; btn.disabled = false;
            }
        }

        async function fetchStats() {
            try {
                const res = await fetch(WORKER + '/api/user-stats', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                document.getElementById('api-key').innerText = data.api_key || "Belum ada";
                document.getElementById('quota').innerText = new Intl.NumberFormat('id-ID').format(data.token_quota || 0) + " Token";
            } catch (e) {
                document.getElementById('api-key').innerText = "Error load";
            }
        }

        function copyKey() {
            const k = document.getElementById('api-key').innerText;
            if(k === 'Memuat...' || k === 'Error load') return;
            navigator.clipboard.writeText(k);
            alert("API Key dicopy!");
        }

        function copyText(text) {
            navigator.clipboard.writeText(text);
            alert("Berhasil dicopy: " + text);
        }

        function topUp() {
            // Ganti nomor WA di bawah ini dengan nomor Admin Anda
            const noWA = "6281234567890"; 
            const pesan = "Halo Admin, saya mau Top-up kuota Tokenobral.";
            window.open(`https://wa.me/${noWA}?text=${encodeURIComponent(pesan)}`, '_blank');
        }

        function doLogout() {
            token = '';
            document.getElementById('login-box').classList.remove('hidden');
            document.getElementById('dash-box').classList.add('hidden');
            document.getElementById('btn-login').innerText = "Masuk"; document.getElementById('btn-login').disabled = false;
        }
    </script>
</body>
</html>
