<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Tokenobral</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: '#10B981' } } } }
    </script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen font-sans">

    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md mx-4">
        <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">Buat Sandi Baru</h2>
        
        <!-- Form Input Password Baru -->
        <div id="formSection" class="hidden">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Password Baru</label>
                <input type="password" id="newPassword" class="w-full px-4 py-2 border rounded-lg focus:ring-brand outline-none" placeholder="Minimal 6 karakter">
            </div>
            <button onclick="updatePassword()" id="btnSubmit" class="w-full bg-brand hover:bg-emerald-600 text-white font-bold py-3 rounded-lg mt-2">Simpan Sandi Baru</button>
        </div>

        <!-- Error State (Jika Link Expired) -->
        <div id="errorSection" class="hidden text-center">
            <p class="text-red-500 mb-4">Link reset password tidak valid atau sudah kedaluwarsa.</p>
            <a href="/" class="text-brand font-bold hover:underline">Kembali ke Halaman Utama</a>
        </div>

        <!-- Loading State -->
        <div id="loadingSection" class="text-center py-10">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-brand mb-4"></div>
            <p class="text-gray-500">Memverifikasi link...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://ebzycnqfbrsbqhmthmux.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVienljbnFmYnJzYnFobXRobXV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMzI3MjcsImV4cCI6MjEwMTYwODcyN30.HfB6CSHtY_jM-1YKS0-2IlU2MtsOgWSNkOaguMQ4Pt0"; 
        
        let accessToken = "";

        // Saat halaman dimuat, ambil token dari URL
        window.onload = () => {
            // URL dari email biasanya: #access_token=xxx&refresh_token=yyy&type=recovery
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            
            accessToken = params.get('access_token');
            const type = params.get('type');

            document.getElementById('loadingSection').classList.add('hidden');

            if (type === 'recovery' && accessToken) {
                // Jika valid, tampilkan form
                document.getElementById('formSection').classList.remove('hidden');
            } else {
                // Jika tidak ada token atau token salah
                document.getElementById('errorSection').classList.remove('hidden');
            }
        };

        async function updatePassword() {
            const newPass = document.getElementById('newPassword').value;
            const btn = document.getElementById('btnSubmit');
            
            if (newPass.length < 6) return alert("Password minimal 6 karakter!");

            btn.innerText = 'Menyimpan...';
            btn.disabled = true;

            try {
                // Kirim permintaan ganti password ke Supabase
                const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                    method: 'PUT',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password: newPass })
                });

                if (res.ok) {
                    alert('✅ Sandi berhasil diubah! Silakan login dengan sandi baru.');
                    window.location.href = '/'; // Kembali ke halaman utama
                } else {
                    const data = await res.json();
                    alert('Gagal: ' + (data.message || 'Terjadi kesalahan.'));
                }
            } catch (e) {
                alert('Koneksi gagal. Periksa internet Anda.');
            } finally {
                btn.innerText = 'Simpan Sandi Baru';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
