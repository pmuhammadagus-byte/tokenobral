<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Tokenobral</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: '#10B981' } } } }
    </script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-4 md:p-8">

    <div id="loginSection" class="max-w-md mx-auto mt-20 bg-white p-8 rounded-2xl shadow-lg text-center">
        <h1 class="text-2xl font-bold mb-2">Admin Panel</h1>
        <p class="text-gray-500 mb-6 text-sm">Login menggunakan akun Supabase kamu.</p>
        <input type="email" id="adminEmail" class="w-full px-4 py-3 border border-gray-300 rounded-lg mb-3 focus:outline-none focus:ring-2 focus:ring-brand" placeholder="Email Admin">
        <input type="password" id="adminPass" class="w-full px-4 py-3 border border-gray-300 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-brand" placeholder="Password">
        <button onclick="loginAdmin()" id="btnLogin" class="w-full bg-brand text-white font-bold py-3 rounded-lg hover:bg-emerald-600 transition-colors">Masuk</button>
        <p id="loginError" class="text-red-500 text-sm mt-3 hidden">Email atau Password salah / Bukan Admin!</p>
    </div>

    <div id="dashboardSection" class="max-w-6xl mx-auto hidden">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-extrabold text-gray-900">Admin Dashboard</h1>
            <button onclick="logoutAdmin()" class="bg-red-500 text-white px-4 py-2 rounded-lg font-bold text-sm">Keluar</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                <p class="text-sm text-gray-500 font-semibold mb-1">Total Pendapatan</p>
                <h2 class="text-3xl font-bold text-green-600" id="statRevenue">Rp 0</h2>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                <p class="text-sm text-gray-500 font-semibold mb-1">Total Pengguna</p>
                <h2 class="text-3xl font-bold text-gray-900" id="statUsers">0</h2>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                <p class="text-sm text-gray-500 font-semibold mb-1">Total Token Terpakai</p>
                <h2 class="text-3xl font-bold text-blue-600" id="statTokens">0</h2>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="p-4 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
                <h3 class="font-bold text-gray-800">Daftar Pengguna</h3>
                <button onclick="loadAdminData()" class="text-brand text-sm font-bold hover:underline">Refresh Data</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-100 text-gray-600">
                        <tr>
                            <th class="p-4">API Key</th>
                            <th class="p-4">Sisa Kuota</th>
                            <th class="p-4">Terpakai</th>
                            <th class="p-4">Masa Aktif</th>
                            <th class="p-4 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr><td colspan="5" class="p-4 text-center">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://api.tokenobral.my.id";
        // Di-inject otomatis oleh script di bawah
        const SUPABASE_URL = "https://ebzycnqfbrsbqhmthmux.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVienljbnFmYnJzYnFobXRobXV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMzI3MjcsImV4cCI6MjEwMTYwODcyN30.HfB6CSHtY_jM-1YKS0-2IlU2MtsOgWSNkOaguMQ4Pt0"; 

        let adminToken = localStorage.getItem('admin_token');

        if (adminToken) {
            loadAdminData();
        }

        async function loginAdmin() {
            const email = document.getElementById('adminEmail').value;
            const pass = document.getElementById('adminPass').value;
            const err = document.getElementById('loginError');
            const btn = document.getElementById('btnLogin');
            
            err.classList.add('hidden');
            btn.innerText = 'Memproses...';
            btn.disabled = true;

            try {
                const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
                    body: JSON.stringify({ email, password: pass })
                });
                const data = await res.json();

                if (res.ok) {
                    adminToken = data.access_token;
                    localStorage.setItem('admin_token', adminToken);
                    loadAdminData();
                } else {
                    err.innerText = 'Error: ' + (data.error_description || data.msg || 'Login gagal');
                    err.classList.remove('hidden');
                }
            } catch (e) {
                err.innerText = "Koneksi gagal. Periksa internet.";
                err.classList.remove('hidden');
            } finally {
                btn.innerText = 'Masuk';
                btn.disabled = false;
            }
        }

        async function loadAdminData() {
            try {
                const res = await fetch(`${WORKER_URL}/api/admin/data`, {
                    headers: { 'Authorization': `Bearer ${adminToken}` }
                });
                
                if (!res.ok) {
                    // 403 = Bukan admin, 401 = Token expired
                    const errData = await res.json(); throw new Error(`Error (${res.status}): ` + JSON.stringify(errData));
                }
                
                const data = await res.json();
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                renderData(data);
            } catch(e) {
                alert(e.message);
                logoutAdmin();
            }
        }

        function renderData(data) {
            document.getElementById('statRevenue').innerText = "Rp " + (data.totalRevenue || 0).toLocaleString('id-ID');
            document.getElementById('statUsers').innerText = (data.totalUsers || 0).toLocaleString('id-ID');
            document.getElementById('statTokens').innerText = (data.totalTokensUsed || 0).toLocaleString('id-ID');

            const tbody = document.getElementById('userTableBody');
            const users = Array.isArray(data.users) ? data.users : [];

            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center">Belum ada user.</td></tr>';
                return;
            }

            tbody.innerHTML = users.map(u => {
                const sisa = (u.token_quota || 0) - (u.token_used || 0);
                const tgl = u.plan_expires_at ? new Date(u.plan_expires_at).toLocaleDateString('id-ID') : '-';
                const isAktif = u.plan_expires_at && new Date(u.plan_expires_at) > new Date() && sisa > 0;
                
                return `
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                    <td class="p-4 font-mono text-xs">${u.api_key || '-'}</td>
                    <td class="p-4 font-bold ${sisa > 0 ? 'text-green-600' : 'text-red-500'}">${sisa.toLocaleString('id-ID')}</td>
                    <td class="p-4 text-gray-600">${(u.token_used || 0).toLocaleString('id-ID')}</td>
                    <td class="p-4">
                        <span class="px-2 py-1 text-xs rounded ${isAktif ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                            ${tgl}
                        </span>
                    </td>
                    <td class="p-4 text-center">
                        <button onclick="deleteUser('${u.id}', '${u.api_key}')" class="bg-red-100 text-red-600 hover:bg-red-200 px-3 py-1 rounded text-xs font-bold">Hapus</button>
                    </td>
                </tr>
                `;
            }).join('');
        }

        async function deleteUser(id, apiKey) {
            if (!confirm(`Yakin ingin menghapus user dengan API Key ${apiKey}?`)) return;
            
            try {
                const res = await fetch(`${WORKER_URL}/api/admin/delete-user`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${adminToken}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id })
                });
                
                if (res.ok) {
                    alert("User berhasil dihapus.");
                    loadAdminData();
                } else {
                    alert("Gagal menghapus user.");
                }
            } catch (e) {
                alert("Error koneksi.");
            }
        }

        function logoutAdmin() {
            localStorage.removeItem('admin_token');
            window.location.reload();
        }
    </script>
</body>
</html>
